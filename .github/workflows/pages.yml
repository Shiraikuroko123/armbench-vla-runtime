name: Deploy project website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Validate static site
        run: |
          node --check site/app.js
          node --check site/research/paper.js
          npx --yes html-validate@10.10.0 site/index.html site/runtime.html

      - name: Upload static site
        id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Wait for the Pages artifact to become visible
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          for attempt in $(seq 1 12); do
            ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id')
            if grep -Fxq "$ARTIFACT_ID" <<< "$ids"; then exit 0; fi
            sleep 5
          done
          echo "The uploaded Pages artifact is not visible to the deployment API." >&2
          exit 1

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
