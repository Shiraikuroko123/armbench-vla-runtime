[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "armbench"
version = "0.1.0"
description = "OpenPI-compatible VLA action runtime assurance in MuJoCo"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = {text = "MIT"}
dependencies = [
  "numpy==1.26.4",
  "matplotlib==3.7.2",
  "mujoco==3.11.0",
  "imageio==2.37.4",
  "imageio-ffmpeg==0.6.0",
]

[project.optional-dependencies]
test = ["pytest==8.3.5"]
vla = [
  "openpi-client @ git+https://github.com/Physical-Intelligence/openpi.git@15a9616a00943ada6c20a0f158e3adb39df2ccac#subdirectory=packages/openpi-client",
  "msgpack==1.2.1",
  "websockets==16.1.1",
]

[project.scripts]
armbench = "armbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
