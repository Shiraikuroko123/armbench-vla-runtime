[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "armbench"
version = "0.1.0"
description = "CPU-only 7-DoF manipulator planning and constrained tracking benchmark"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = {text = "MIT"}
dependencies = [
  "numpy==1.26.4",
  "matplotlib==3.7.2",
]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[project.scripts]
armbench = "armbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

